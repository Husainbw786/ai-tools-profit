# Deploys the app to Vercel with the Vercel CLI.
#
# Required repository secret:
#   VERCEL_TOKEN                 - a Vercel personal access token
# Optional repository secrets (written to the Vercel project as env vars):
#   SUPABASE_URL                 - https://<project>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY     - sb_publishable_... (or legacy anon key)
#   SUPABASE_SERVICE_ROLE_KEY    - service role key (server-only, bypasses RLS)
#   ADMIN_USER_ID                - Supabase auth user id allowed to run admin actions
#
# Run it from the Actions tab (workflow_dispatch) or push to main.
name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link or create the Vercel project
        run: vercel link --yes --token "$VERCEL_TOKEN"

      - name: Sync environment variables to Vercel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY ADMIN_USER_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              for target in production preview; do
                printf '%s' "$value" | vercel env add "$name" "$target" --force --token "$VERCEL_TOKEN" >/dev/null
              done
              echo "synced $name"
            fi
          done

      - name: Deploy (production)
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN" | tee deploy-url.txt

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$(tail -n1 deploy-url.txt)" >> "$GITHUB_STEP_SUMMARY"
